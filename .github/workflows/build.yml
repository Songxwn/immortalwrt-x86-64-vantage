name: Build ImmortalWrt 25.12 源码 (x86/64 + Vantage + BBRv3)

# 从 ImmortalWrt 源码全量构建，并打入 BBRv3 内核补丁（主线只有 BBRv1）。
# 这是正式固件流程；ImageBuilder 快速流程见 build-imagebuilder.yml（手动触发）。
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      version:
        description: "ImmortalWrt 25.12.x 版本号（如 25.12.2）"
        required: true
        default: "25.12.2"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  IW_VERSION: ${{ github.event.inputs.version || '25.12.2' }}
  IW_DIR: immortalwrt
  VANTAGE_REF: v1.2.0
  CCACHE_MAXSIZE: 2G

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: 校验版本号
        run: |
          set -euo pipefail
          case "$IW_VERSION" in
            25.12|25.12.*) ;;
            *) echo "::error::只支持 ImmortalWrt 25.12.x（当前：$IW_VERSION）"; exit 1 ;;
          esac
          echo "构建版本: $IW_VERSION（源码全量构建 + BBRv3）"

      - uses: actions/checkout@v7

      - name: 释放 runner 磁盘空间
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile || true
          df -h /

      - name: 安装编译依赖
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache ecj fastjar file g++ gawk gettext git libelf-dev \
            libncurses-dev libssl-dev python3 python3-dev python3-setuptools \
            python3-yaml rsync subversion swig time unzip wget zlib1g-dev

      - name: 克隆 ImmortalWrt 源码
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "v${IW_VERSION}" \
            https://github.com/immortalwrt/immortalwrt.git "$IW_DIR"
          echo "IW=$(pwd)/$IW_DIR" >> "$GITHUB_ENV"
          git -C "$IW_DIR" log -1 --format='%H %s'

      - name: 添加 Vantage 主题源（feed）
        run: |
          set -euo pipefail
          cd "$IW_DIR"
          echo "src-git vantage https://github.com/anothaDev/luci-theme-vantage.git;${VANTAGE_REF}" \
            >> feeds.conf.default
          cat feeds.conf.default

      - name: 更新并安装 feeds
        run: |
          set -euo pipefail
          cd "$IW_DIR"
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 注入自定义文件（files/）
        run: |
          set -euo pipefail
          rm -rf "$IW_DIR/files"
          cp -a "$GITHUB_WORKSPACE/files" "$IW_DIR/files"
          find "$IW_DIR/files" -type f

      - name: 打入 BBRv3 内核补丁（OpenWrt PR #16414）
        run: |
          set -euo pipefail
          DEST="$IW_DIR/target/linux/generic/hack-6.12"
          test -d "$DEST" || { echo "::error::找不到 $DEST"; exit 1; }
          cp "$GITHUB_WORKSPACE"/patches/kernel/bbr3/900-*.patch "$DEST/"
          echo "已放入 $(ls -1 "$DEST"/900-*.patch | wc -l) 个 BBRv3 补丁"

      - name: 修补镜像脚本（稀疏镜像 / gzip -1）
        run: python3 "$GITHUB_WORKSPACE/ci/patch-sparse.py" "$IW_DIR"

      - name: 恢复 ccache / 源码下载缓存
        uses: actions/cache@v6
        with:
          path: |
            immortalwrt/.ccache
            immortalwrt/dl
          key: iw-${{ env.IW_VERSION }}-${{ hashFiles('config/packages.txt', 'docs/reference/profiles.json') }}-${{ github.run_id }}
          restore-keys: |
            iw-${{ env.IW_VERSION }}-${{ hashFiles('config/packages.txt', 'docs/reference/profiles.json') }}-
            iw-${{ env.IW_VERSION }}-

      - name: 生成并校验 .config
        run: |
          set -euo pipefail
          cd "$IW_DIR"
          python3 "$GITHUB_WORKSPACE/ci/gen-config.py" "$GITHUB_WORKSPACE" > .config
          make defconfig
          python3 "$GITHUB_WORKSPACE/ci/verify-config.py" "$GITHUB_WORKSPACE" .config "$IW/tmp/.packageinfo"
          echo "--- 关键开关 ---"
          grep -E '^CONFIG_(TARGET_(KERNEL|ROOTFS)_PARTSIZE|TARGET_x86_64_DEVICE_generic|TARGET_MULTI_PROFILE|TARGET_ROOTFS_SQUASHFS|ISO_IMAGES|QCOW2_IMAGES|TARGET_ROOTFS_EXT4FS)=' .config || true

      - name: 下载源码
        run: |
          set -uo pipefail
          cd "$IW_DIR"
          make -j"$(nproc)" download || echo "::warning::部分源码下载失败，编译阶段会重试"

      - name: 编译固件（失败自动剔除编译不过的包）
        run: |
          set -uo pipefail
          cd "$IW_DIR"
          LOG="$GITHUB_WORKSPACE/build.log"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            echo "::group::第 $attempt 次编译"
            if make -j"$(nproc)" 2>&1 | tee "$LOG"; then
              ok=1; echo "::endgroup::"; break
            fi
            echo "::endgroup::"

            paths="$(grep -oE 'ERROR: [A-Za-z0-9_./-]+ failed to build' "$LOG" \
                      | sed -E 's/^ERROR: //; s/ failed to build$//' | sort -u || true)"
            pkgs=""
            for p in $paths; do
              echo "编译失败：$p"
              [ -f "logs/$p/error.txt" ] && sed -n '1,15p' "logs/$p/error.txt" || true
              case "$p" in
                package/*) pkgs="$pkgs $(basename "$p")" ;;
              esac
            done
            pkgs="$(echo "$pkgs" | tr ' ' '\n' | grep -v '^$' | sort -u | tr '\n' ' ')"
            if [ -z "$pkgs" ]; then
              echo "::error::编译失败，且无法定位到软件包，见上方日志"
              tail -n 120 "$LOG"
              exit 1
            fi
            echo "以下包编译失败，禁用后重试：$pkgs"
            for p in $pkgs; do
              sed -i "/^CONFIG_PACKAGE_${p}=[ym]$/d" .config
              echo "# CONFIG_PACKAGE_${p} is not set" >> .config
            done
            make defconfig >/dev/null
          done
          [ "$ok" = "1" ] || { echo "::error::重试 6 次后仍然编译失败"; exit 1; }
          find bin/targets/x86/64 -maxdepth 1 -type f -name '*.img.gz' -printf '%f\n' | sort

      - name: 校验分区表（对齐现网 16 MiB + 20 GiB）
        run: |
          set -euo pipefail
          ls -lh "$IW"/bin/targets/x86/64/*.img.gz
          python3 - "$IW/bin/targets/x86/64" <<'PY'
          import glob, gzip, os, struct, sys
          d = sys.argv[1]
          cands = [p for p in glob.glob(os.path.join(d, "*combined.img.gz"))
                   if "combined-efi" not in os.path.basename(p)]
          assert cands, "找不到 BIOS combined.img.gz"
          p = sorted(cands)[0]
          with gzip.open(p, "rb") as f:
              mbr = f.read(512)
          assert mbr[510:512] == b"\x55\xaa", "不是有效的 MBR"
          parts = []
          for i in range(4):
              e = mbr[446 + 16 * i:462 + 16 * i]
              if e[4] == 0:
                  continue
              start, size = struct.unpack("<II", e[8:16])
              parts.append((e[4], start, size))
          print("image:", os.path.basename(p))
          for n, (ptype, start, size) in enumerate(parts, 1):
              print(f"  partition {n}: type=0x{ptype:02x} start={start} size={size} sectors ({size*512//2**20} MiB)")
          assert len(parts) == 2, f"分区数量异常: {len(parts)}"
          kernel_mib = parts[0][2] * 512 // 2**20
          rootfs_mib = parts[1][2] * 512 // 2**20
          assert kernel_mib == 16, f"kernel 分区应为 16 MiB，实际 {kernel_mib} MiB"
          assert rootfs_mib == 20480, f"rootfs 分区应为 20480 MiB，实际 {rootfs_mib} MiB"
          print("分区表与现网设备一致")
          PY

      - name: 校验 BBRv3 已进入内核与固件
        run: |
          set -euo pipefail
          SRC="$(find "$IW/build_dir" -maxdepth 3 -type d -name 'linux-6.12.*' | head -n1)"
          test -n "$SRC" || { echo "::error::找不到内核源码目录"; exit 1; }
          echo "内核源码: $SRC"
          grep -n 'define BBR_VERSION' "$SRC/net/ipv4/tcp_bbr.c"
          grep -q 'BBR_VERSION[[:space:]]*3' "$SRC/net/ipv4/tcp_bbr.c" || {
            echo "::error::内核里的 tcp_bbr.c 不是 v3（未找到 BBR_VERSION 3）"; exit 1; }

          MANIFEST="$(find "$IW/bin/targets/x86/64" -maxdepth 1 -name '*.manifest' | head -n1)"
          test -n "$MANIFEST" || { echo "::error::找不到镜像 manifest"; exit 1; }
          grep -E '^kmod-tcp-bbr |^kmod-sched |^kmod-sched-core ' "$MANIFEST" || {
            echo "::error::manifest 中缺少 kmod-tcp-bbr / kmod-sched"; exit 1; }
          echo "BBRv3 内核 + kmod-tcp-bbr / kmod-sched 已进入固件"

      - name: 校验默认 BBR 配置（bbr + fq）
        run: |
          set -euo pipefail
          ROOT="$(find "$IW/build_dir" -maxdepth 2 -type d -name 'root-x86*' | head -n1)"
          test -n "$ROOT" || { echo "::error::找不到 rootfs 目录"; exit 1; }
          test -f "$ROOT/etc/sysctl.d/99-bbr.conf" || {
            echo "::error::固件里缺少 /etc/sysctl.d/99-bbr.conf"; exit 1; }
          grep -qE '^[[:space:]]*net\.core\.default_qdisc[[:space:]]*=[[:space:]]*fq' "$ROOT/etc/sysctl.d/99-bbr.conf"
          grep -qE '^[[:space:]]*net\.ipv4\.tcp_congestion_control[[:space:]]*=[[:space:]]*bbr' "$ROOT/etc/sysctl.d/99-bbr.conf"
          echo "--- $ROOT/etc/sysctl.d ---"
          ls -l "$ROOT/etc/sysctl.d"

      - name: 收集产物
        run: |
          set -euo pipefail
          mkdir -p out
          cp "$IW"/bin/targets/x86/64/*.img.gz out/ 2>/dev/null || true
          cp "$IW"/bin/targets/x86/64/sha256sums out/ 2>/dev/null || true
          cp "$IW"/bin/targets/x86/64/*.manifest out/ 2>/dev/null || true
          test -n "$(ls -A out)"
          ( cd out && sha256sum *.img.gz > SHA256SUMS.images )
          ls -lh out

      - uses: actions/upload-artifact@v7
        with:
          name: immortalwrt-${{ env.IW_VERSION }}-x86-64-vantage-bbrv3
          path: out/*
          if-no-files-found: error

      - name: 发布 latest Release（main 分支）
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --target "$GITHUB_SHA" --title "Latest build" --notes "自动构建"
          gh release upload latest out/* --clobber
          gh release edit latest \
            --title "Latest build: ImmortalWrt ${IW_VERSION} + Vantage + BBRv3" \
            --notes "由 GitHub Actions 源码全量构建（$(date -u '+%Y-%m-%d %H:%M UTC')）。
          - 目标：x86/64 generic（分区 16 MiB kernel + 20 GiB rootfs，与现网设备一致）
          - 内核：Linux 6.12.103 + **BBRv3** 补丁（OpenWrt PR #16414），默认拥塞控制 bbr + fq
          - 主题：Vantage 1.2.x（含中文语言包）
          - 刷机：UEFI 用 *combined-efi.img.gz，Legacy BIOS 用 *combined.img.gz
          - 查看已装包：Release 里的 *.manifest"

      - name: 打 tag 时发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: out/*
          generate_release_notes: true
